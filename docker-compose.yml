version: '3.8'

# 1. Общие переменные для микросервисов (берутся из .env)
x-common-env: &common-env
  POSTGRES_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_NAME}?sslmode=disable"
  CLICKHOUSE_ADDR: "clickhouse:9000"
  REDIS_ADDR: "redis:6379"
  KAFKA_BROKER: "kafka:29092"

# 2. Ограничение логов для всех сервисов (макс 10МБ * 3 файла = 30МБ)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  backend:
    driver: bridge

services:
  # ==========================================
  # ИНФРАСТРУКТУРА
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME} # В .env это POSTGRES_NAME
    volumes:
      - ./containers/data/postgres:/var/lib/postgresql/data
      - ./containers/init/postgres:/docker-entrypoint-initdb.d
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "${CLICKHOUSE_PORT}:9000"
      - "8123:8123"
    volumes:
      - ./containers/data/clickhouse:/var/lib/clickhouse
      - ./containers/init/clickhouse:/docker-entrypoint-initdb.d
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --appendonly yes
    volumes:
      - ./containers/data/redis:/data
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      # Настройки KRaft (без Zookeeper)
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      
      # Слушатели: INTERNAL (для контейнеров) и EXTERNAL (для локальной сети)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_HOST}:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      
      # Обязательные настройки для одного брокера
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    volumes:
      - ./containers/data/kafka:/var/lib/kafka/data
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./containers/data/prometheus:/prometheus
      - ./containers/init/prometheus:/etc/prometheus
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./containers/data/grafana:/var/lib/grafana
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "${ALERTMANAGER_PORT}:9093"
    volumes:
      - ./containers/data/alertmanager:/alertmanager
      - ./containers/init/alertmanager:/etc/alertmanager
    networks:
      - backend
    restart: unless-stopped
    logging: *default-logging

